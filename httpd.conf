# ==============================================================================
# DDS Windows Apache HTTP Server Master Configuration
# ==============================================================================
ServerRoot "C:/DDS/Services/apache"
Listen 8080
Listen 8443
ServerAdmin admin@localhost
ServerName localhost:8080

# Dynamic Modules
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule alias_module modules/mod_alias.so
LoadModule actions_module modules/mod_actions.so
LoadModule cgi_module modules/mod_cgi.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

<Directory />
    AllowOverride none
    Require all denied
</Directory>

# PHP CGI Configuration
ScriptAlias /php-cgi/ "C:/DDS/Services/php/"
<Directory "C:/DDS/Services/php">
    AllowOverride None
    Options None
    Require all granted
</Directory>

AddType application/x-httpd-php .php
Action application/x-httpd-php "/php-cgi/php-cgi.exe"

# Default Document Root
DocumentRoot "C:/DDS/Projects"
<Directory "C:/DDS/Projects">
    Options Indexes FollowSymLinks ExecCGI
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html index.htm
</Directory>

# phpMyAdmin Integration
Alias /phpmyadmin "C:/DDS/Services/web/phpmyadmin"
<Directory "C:/DDS/Services/web/phpmyadmin">
    Options Indexes FollowSymLinks ExecCGI
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

# phpInfo Integration
Alias /phpinfo "C:/DDS/Services/web/phpinfo"
<Directory "C:/DDS/Services/web/phpinfo">
    Options Indexes FollowSymLinks ExecCGI
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

# Logging Configuration
ErrorLog "C:/DDS/Logs/apache_error.log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "C:/DDS/Logs/apache_access.log" common

# Virtual Hosts Include
IncludeOptional conf/extra/httpd-vhosts.conf
